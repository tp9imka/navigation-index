name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build is reproducible and clean
        run: |
          python3 tools/build.py | tee build.log
          grep -q "dangling: 0 bad concepts: 0" build.log
          git diff --stat --exit-code -- catalog INDEX.md graph/graph.json index llms.txt reports
      - name: Links resolve
        run: python3 tools/check_links.py
      - name: Stdlib sample tests
        run: |
          make -C templates/project-repo test
          while read -r d; do
            [ -z "$d" ] && continue
            (cd "samples/$d" && python3 -m unittest discover -q) || exit 1
          done < tools/stdlib-sample-tests.txt
