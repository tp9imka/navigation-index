name: check
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build from the committed tree
        run: |
          python3 tools/build.py | tee build.log
          python3 templates/offline-kit/build_manifest.py
          grep -q "dangling: 0 bad concepts: 0" build.log
      - name: Links resolve
        run: python3 tools/check_links.py
      - name: Search ranker parity (Python vs site JS)
        run: python3 tools/search_eval.py --parity
      - name: Stdlib sample and template tests
        run: |
          python3 tools/test_mcp_server.py
          make -C templates/project-repo test
          (cd templates/demo-dashboard && python3 -m unittest -q)
          (cd templates/offline-kit && python3 -m unittest -q)
          while read -r d; do
            [ -z "$d" ] && continue
            (cd "samples/$d" && python3 -m unittest discover -q) || exit 1
          done < tools/stdlib-sample-tests.txt
      # Generated files are derived from data/, samples/ and docs/; CI owns them on main so a
      # local build from a dirty tree can never leave the published catalog inconsistent.
      - name: Commit regenerated catalog on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "navigation-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog INDEX.md graph/graph.json index llms.txt reports site/data samples/README.md templates/offline-kit/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate catalog [skip ci]"
            git push
          fi
